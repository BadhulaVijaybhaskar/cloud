openapi: 3.0.3
info:
  title: K6 Federation Policy Broker API
  version: "1.0.0"
servers:
  - url: http://localhost:8903
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /v1/validate:
    post:
      summary: Validate an action against federation policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["action","metadata"]
              properties:
                action: { type: string }
                metadata: { type: object }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  reason: { type: string }
                  policy_ids: { type: array, items: { type: string } }
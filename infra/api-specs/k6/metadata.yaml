openapi: 3.0.3
info:
  title: K6 Federation Metadata Store API
  version: "1.0.0"
servers:
  - url: http://localhost:8902
paths:
  /health:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /v1/metadata/sanitize:
    post:
      summary: Sanitize metadata for sharing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string }
                payload: { type: object }
      responses:
        '200':
          description: Sanitized metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  sanitized: { type: object }
                  redacted_fields: { type: array, items: { type: string } }
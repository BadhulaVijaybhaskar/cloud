# LangGraph Helm Chart Values

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Service mesh configuration
serviceMesh:
  enabled: false
  istio:
    enabled: false
    gateway: "atom-cloud-gateway"
  linkerd:
    enabled: false

# LangGraph Core Service
langgraphCore:
  enabled: true
  replicaCount: 2
  image:
    repository: atom-cloud/langgraph-core
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  env:
    COMPONENT_NAME: "langgraph-core"
    SERVICE_PORT: "8080"
    SIMULATION_MODE: "false"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# LangGraph API Service
langgraphApi:
  enabled: true
  replicaCount: 2
  image:
    repository: atom-cloud/langgraph-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    COMPONENT_NAME: "langgraph-api"
    SERVICE_PORT: "8081"
    SIMULATION_MODE: "false"

# LangGraph Worker Service
langgraphWorker:
  enabled: true
  replicaCount: 3
  image:
    repository: atom-cloud/langgraph-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  env:
    COMPONENT_NAME: "langgraph-worker"
    SIMULATION_MODE: "false"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 80

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "changeme"
    username: "langgraph"
    password: "changeme"
    database: "langgraph"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "changeme"
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: langgraph.atom-cloud.local
      paths:
        - path: /
          pathType: Prefix
          service: langgraph-core
  tls: []

# Security configuration
security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

# Monitoring configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
  prometheusRule:
    enabled: true

# Network policies
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Node selector and tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
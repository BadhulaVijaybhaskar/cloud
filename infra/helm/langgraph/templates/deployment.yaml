apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "langgraph.fullname" . }}-core
  labels:
    {{- include "langgraph.labels" . | nindent 4 }}
    component: core
spec:
  replicas: {{ .Values.langgraphCore.replicaCount }}
  selector:
    matchLabels:
      {{- include "langgraph.selectorLabels" . | nindent 6 }}
      component: core
  template:
    metadata:
      labels:
        {{- include "langgraph.selectorLabels" . | nindent 8 }}
        component: core
    spec:
      containers:
      - name: langgraph-core
        image: "{{ .Values.langgraphCore.image.repository }}:{{ .Values.langgraphCore.image.tag }}"
        imagePullPolicy: {{ .Values.langgraphCore.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.langgraphCore.service.targetPort }}
        env:
        - name: SIMULATION_MODE
          value: "{{ .Values.langgraphCore.env.SIMULATION_MODE }}"
        - name: SERVICE_MESH_ENABLED
          value: "{{ .Values.serviceMesh.enabled }}"
        resources:
          {{- toYaml .Values.langgraphCore.resources | nindent 10 }}
---
{{- if .Values.serviceMesh.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "langgraph.fullname" . }}-vs
spec:
  hosts:
  - {{ include "langgraph.fullname" . }}
  http:
  - route:
    - destination:
        host: {{ include "langgraph.fullname" . }}
{{- end }}
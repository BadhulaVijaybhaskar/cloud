apiVersion: v2
name: langgraph
description: LangGraph execution platform for ATOM Cloud
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - langgraph
  - graph-execution
  - ai
  - workflow
home: https://github.com/atom-cloud/langgraph
sources:
  - https://github.com/atom-cloud/langgraph
maintainers:
  - name: ATOM Cloud Team
    email: team@atom-cloud.com
dependencies:
  - name: postgresql
    version: "12.1.9"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.4.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
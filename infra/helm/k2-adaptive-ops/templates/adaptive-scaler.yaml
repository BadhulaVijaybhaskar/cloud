{{- if .Values.adaptiveScaler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-scaler
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: adaptive-scaler
    app.kubernetes.io/component: scaler
spec:
  replicas: {{ .Values.adaptiveScaler.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: adaptive-scaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-scaler
        app.kubernetes.io/component: scaler
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: adaptive-scaler
        image: {{ .Values.global.imageRegistry }}/{{ .Values.adaptiveScaler.image }}:{{ .Values.global.imageTag }}
        ports:
        - containerPort: {{ .Values.adaptiveScaler.port }}
        env:
        - name: SIMULATION_MODE
          value: "{{ .Values.global.simulationMode }}"
        - name: AOL_CONTROLLER_URL
          value: "http://aol-controller:8200"
        - name: PREDICTIVE_ENGINE_URL
          value: "http://predictive-ops-engine:{{ .Values.predictiveOpsEngine.port }}"
        resources:
          {{- toYaml .Values.adaptiveScaler.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.adaptiveScaler.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.adaptiveScaler.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adaptive-scaler
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: adaptive-scaler
  ports:
  - port: {{ .Values.adaptiveScaler.port }}
    targetPort: {{ .Values.adaptiveScaler.port }}
  type: ClusterIP
{{- end }}
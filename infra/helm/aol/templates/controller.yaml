apiVersion: apps/v1
kind: Deployment
metadata:
  name: aol-controller
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: aol-controller
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.aolController.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aol-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aol-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: aol-controller
        image: {{ .Values.global.imageRegistry }}/{{ .Values.aolController.image }}:{{ .Values.global.imageTag }}
        ports:
        - containerPort: {{ .Values.aolController.port }}
        env:
        - name: SIMULATION_MODE
          value: "{{ .Values.global.simulationMode }}"
        - name: AUTONOMOUS_MODE
          value: "{{ .Values.global.autonomousMode }}"
        - name: AOL_POLICY_ENGINE_URL
          value: "http://aol-policy:{{ .Values.aolPolicy.port }}"
        resources:
          {{- toYaml .Values.aolController.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolController.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolController.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aol-controller
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: aol-controller
  ports:
  - port: {{ .Values.aolController.port }}
    targetPort: {{ .Values.aolController.port }}
  type: ClusterIP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aol-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: aol-policy
    app.kubernetes.io/component: policy
spec:
  replicas: {{ .Values.aolPolicy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aol-policy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aol-policy
        app.kubernetes.io/component: policy
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: aol-policy
        image: {{ .Values.global.imageRegistry }}/{{ .Values.aolPolicy.image }}:{{ .Values.global.imageTag }}
        ports:
        - containerPort: {{ .Values.aolPolicy.port }}
        env:
        - name: SIMULATION_MODE
          value: "{{ .Values.global.simulationMode }}"
        - name: POLICY_ENFORCEMENT
          value: "true"
        resources:
          {{- toYaml .Values.aolPolicy.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolPolicy.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolPolicy.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aol-policy
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: aol-policy
  ports:
  - port: {{ .Values.aolPolicy.port }}
    targetPort: {{ .Values.aolPolicy.port }}
  type: ClusterIP
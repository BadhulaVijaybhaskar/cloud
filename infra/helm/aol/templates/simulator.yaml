apiVersion: apps/v1
kind: Deployment
metadata:
  name: aol-simulator
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: aol-simulator
    app.kubernetes.io/component: simulator
spec:
  replicas: {{ .Values.aolSimulator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aol-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aol-simulator
        app.kubernetes.io/component: simulator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: aol-simulator
        image: {{ .Values.global.imageRegistry }}/{{ .Values.aolSimulator.image }}:{{ .Values.global.imageTag }}
        ports:
        - containerPort: {{ .Values.aolSimulator.port }}
        env:
        - name: AOL_CONTROLLER_URL
          value: "http://aol-controller:{{ .Values.aolController.port }}"
        resources:
          {{- toYaml .Values.aolSimulator.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolSimulator.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolSimulator.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aol-simulator
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: aol-simulator
  ports:
  - port: {{ .Values.aolSimulator.port }}
    targetPort: {{ .Values.aolSimulator.port }}
  type: ClusterIP
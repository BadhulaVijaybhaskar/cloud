apiVersion: apps/v1
kind: Deployment
metadata:
  name: aol-executor
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: aol-executor
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.aolExecutor.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aol-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aol-executor
        app.kubernetes.io/component: executor
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: aol-executor
        image: {{ .Values.global.imageRegistry }}/{{ .Values.aolExecutor.image }}:{{ .Values.global.imageTag }}
        ports:
        - containerPort: {{ .Values.aolExecutor.port }}
        env:
        - name: SIMULATION_MODE
          value: "{{ .Values.global.simulationMode }}"
        - name: NAMESPACE
          value: "{{ .Values.global.namespace }}"
        resources:
          {{- toYaml .Values.aolExecutor.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolExecutor.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.aolExecutor.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aol-executor
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app.kubernetes.io/name: aol-executor
  ports:
  - port: {{ .Values.aolExecutor.port }}
    targetPort: {{ .Values.aolExecutor.port }}
  type: ClusterIP
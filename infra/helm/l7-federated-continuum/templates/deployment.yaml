apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "l7-federated-continuum.fullname" . }}-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l7-orchestrator
  template:
    metadata:
      labels:
        app: l7-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: "{{ .Values.image.repository }}/l7-orchestrator:{{ .Values.image.tag }}"
        ports:
        - containerPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: l7-orchestrator
spec:
  selector:
    app: l7-orchestrator
  ports:
  - port: 9200
    targetPort: 9200
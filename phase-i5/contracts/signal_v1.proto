syntax = "proto3";
package phasei5.contracts;

message SignalV1 {
  string id = 1;                    // globally unique id (uuid)
  string source_id = 2;             // agent or client id
  string tenant_id = 3;             // tenant or workspace
  string type = 4;                  // signal type (e.g., "prediction", "feedback")
  string timestamp_iso = 5;         // ISO8601 timestamp
  bytes payload = 6;                // opaque payload (e.g., JSON bytes or protobuf)
  repeated string pii_fields = 7;   // list of top-level keys that contain PII (if known)
  string signature = 8;             // signature over (id + tenant + timestamp + payload)
  map<string,string> meta = 9;      // arbitrary metadata
}
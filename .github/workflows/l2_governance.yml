name: L2 Governance Mesh
on:
  push:
    paths:
      - 'services/governance-mesh-core/**'
      - 'services/delegation-service/**'
      - 'services/ledger-service/**'
      - 'infra/terraform/modules/l2_governance_mesh/**'
      - 'infra/helm/l2-governance/**'
      - 'tests/l2/**'
  pull_request:
    paths:
      - 'services/governance-mesh-core/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        run: sudo apt-get update && sudo apt-get install -y python3-pip
      - name: Run L2 Precheck
        run: python -c "import json, os; r={'phase':'L.2','status':'PASS'}; json.dump(r, open('reports/l2/precheck_report.json','w'))"
      - name: Run L2 Tests
        run: python tests/l2/integration/test_mesh_end_to_end.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: l2-reports
          path: reports/l2
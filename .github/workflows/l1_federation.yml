name: L.1 Federation CI/CD

on:
  push:
    branches: [ prod-feature/l1.federated-autonomy ]
  pull_request:
    branches: [ main ]
    paths: 
      - 'services/federation-*/**'
      - 'infra/terraform/modules/l1_federation/**'
      - 'infra/helm/l1-federation/**'
      - 'tests/l1/**'

env:
  SIMULATION_MODE: true
  APPROVE_FEDERATION: false

jobs:
  l1-precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run L.1 Precheck
        run: |
          chmod +x infra/scripts/l1/precheck.sh
          SIMULATION_MODE=true ./infra/scripts/l1/precheck.sh
      
      - name: Upload Precheck Report
        uses: actions/upload-artifact@v3
        with:
          name: l1-precheck-report
          path: reports/l1/precheck_report.json

  l1-test:
    runs-on: ubuntu-latest
    needs: l1-precheck
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install flask requests pytest
      
      - name: Run L.1 Tests
        run: |
          python -m pytest tests/l1/ -v --tb=short
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: l1-test-results
          path: tests/l1/

  l1-deploy-simulation:
    runs-on: ubuntu-latest
    needs: [l1-precheck, l1-test]
    steps:
      - uses: actions/checkout@v3
      
      - name: Run L.1 Deploy (Simulation)
        run: |
          chmod +x infra/scripts/l1/deploy.sh
          SIMULATION_MODE=true ./infra/scripts/l1/deploy.sh
      
      - name: Upload Deploy Summary
        uses: actions/upload-artifact@v3
        with:
          name: l1-deploy-summary
          path: reports/l1/deploy_summary.json
      
      - name: Upload Federation Health
        uses: actions/upload-artifact@v3
        with:
          name: l1-federation-health
          path: reports/l1/federation_health.json

  l1-verify:
    runs-on: ubuntu-latest
    needs: l1-deploy-simulation
    steps:
      - uses: actions/checkout@v3
      
      - name: Run L.1 Verification
        run: |
          chmod +x infra/scripts/l1/verify.sh
          SIMULATION_MODE=true ./infra/scripts/l1/verify.sh
      
      - name: Upload Verification Report
        uses: actions/upload-artifact@v3
        with:
          name: l1-verification-report
          path: reports/l1/verification_summary.json

  l1-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Security Scan
        run: |
          echo "Security scan for L.1 federation services (simulation mode)"
          echo "Checking for hardcoded secrets..."
          ! grep -r "password\|secret\|key" services/federation-* || echo "No hardcoded secrets found"
          echo "Checking P25-P27 policy compliance..."
          grep -r "P25\|P26\|P27" services/federation-policy-broker/ || echo "Policy references found"